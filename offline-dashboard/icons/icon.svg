<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <linearGradient id="gradLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="100%" stop-color="#40916c" />
    </linearGradient>
    <linearGradient id="gradSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)" />

  <!-- Sun in background -->
  <circle cx="256" cy="180" r="70" fill="url(#gradSun)" opacity="0.9" />

  <!-- Farm hills -->
  <path d="M40 390 C 140 310, 220 330, 310 390 C 370 430, 430 410, 472 380 L 472 472 L 40 472 Z" fill="#2d6a4f" opacity="0.6" />
  <path d="M40 430 C 170 360, 320 380, 472 430 L 472 472 L 40 472 Z" fill="#1b4332" />

  <!-- Sprouting plant / leaf symbol -->
  <g transform="translate(256, 320) scale(1.4)">
    <!-- Stem -->
    <path d="M0,0 Q -4,-50 0,-100" stroke="#f4f6f0" stroke-width="12" stroke-linecap="round" fill="none" />
    
    <!-- Left Leaf -->
    <path d="M -2,-55 C -45,-75 -65,-30 -2,-25 Z" fill="url(#gradLeaf)" />
    <!-- Right Leaf -->
    <path d="M 0,-70 C 45,-90 65,-45 0,-40 Z" fill="#74c69d" />
    <!-- Top Sprout Leaf -->
    <path d="M 0,-100 C -25,-125 0,-145 0,-145 C 0,-145 25,-125 0,-100 Z" fill="#a7f3d0" />
  </g>
</svg>
